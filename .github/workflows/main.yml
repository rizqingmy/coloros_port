name: Build ColorOS Port

on:
  workflow_dispatch:
  push:
    branches: [ main, COS16/OOS16 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full unace zip unzip lzop git xmlstarlet python3 openjdk-11-jre-headless
          pip3 install --upgrade uv --break-system-packages || pip install --upgrade uv

      - name: Download ROMs
        run: |
          echo "==> Downloading Base ROM (ColorOS 14 OnePlus 9 Pro)..."
          aria2c -x 8 -s 8 -k 1M --timeout=30 --max-tries=5 \
            -o "Copy of c14Op9p_qcom.zip" "https://pixeldrain.com/u/6tWiZsAy"

          echo "==> Downloading Donor ROM (ColorOS 17 OnePlus 15)..."
          git clone https://github.com/ltsdw/gofile-downloader.git
          uv run gofile-downloader/gofile-downloader.py "https://gofile.io/d/PXMZheo2"

          echo "==> Renaming ROM files to expected names..."
          mv -v "Copy of c14Op9p_qcom.zip" c14Op9p_qcom.zip || true
          find . -maxdepth 3 -type f -name "Copy of c17Op15_qcom.zip" -exec mv -v {} ./c17Op15_qcom.zip \;
          rm -rf gofile-downloader downloads

          echo "==> Verifying ROM files..."
          ls -lh c14Op9p_qcom.zip c17Op15_qcom.zip
          sha256sum c14Op9p_qcom.zip c17Op15_qcom.zip

      - name: Debug Partition Config
        run: |
          echo "==> Partitions to port:"
          grep "partition_to_port" bin/port_config
          echo "==> Possible super partitions:"
          grep "possible_super_list" bin/port_config

      - name: Clean Build Cache
        run: rm -rf build/* output/* out/*

      - name: Run Porting Process
        run: |
          if [ -f "./setup.sh" ]; then
            chmod +x ./setup.sh
            ./setup.sh
          fi
          chmod +x ./port.sh
          ./port.sh c14Op9p_qcom.zip c17Op15_qcom.zip
          rm -f c14Op9p_qcom.zip c17Op15_qcom.zip

      - name: Upload Output Zip
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17_OnePlus9Pro_Port
          path: |
            output/*.zip
            out/*.zip
          if-no-files-found: error
