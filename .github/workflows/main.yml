name: Build ColorOS Port

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - COS16/OOS16

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "==> Initial storage"
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium

          sudo docker image prune -af || true

          echo "==> After cleanup"
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            p7zip-full \
            unace \
            zip \
            unzip \
            lzop \
            git \
            xmlstarlet \
            python3 \
            python3-pip \
            openjdk-11-jre-headless \
            wget

          pip3 install -U huggingface_hub hf_xet

      - name: Download ROMs From Hugging Face
        run: |
          python3 << 'PY'
          from huggingface_hub import hf_hub_download

          print("Downloading Base ROM...")
          hf_hub_download(
              repo_id="rizqingsenpai/coloros_port_roms",
              filename="c14Op9p_qcom.zip",
              local_dir="."
          )

          print("Downloading Donor ROM...")
          hf_hub_download(
              repo_id="rizqingsenpai/coloros_port_roms",
              filename="c17Op15_qcom.zip",
              local_dir="."
          )
          PY

          echo "==> Verify downloads"
          ls -lh *.zip

          test $(stat -c%s c14Op9p_qcom.zip) -gt 1000000000 || (echo "Base ROM too small!" && exit 1)
          test $(stat -c%s c17Op15_qcom.zip) -gt 1000000000 || (echo "Donor ROM too small!" && exit 1)

          echo "==> Storage after downloads"
          df -h /

      - name: Show Port Config
        run: |
          grep partition_to_port bin/port_config || true
          grep possible_super_list bin/port_config || true

      - name: Clean Build Cache
        run: |
          rm -rf build output out
          mkdir -p build output out

      - name: Run Setup
        run: |
          if [ -f setup.sh ]; then
            chmod +x setup.sh
            ./setup.sh
          fi

      - name: Update Apktool
        run: |
          echo "==> Updating Apktool to v2.11.1..."
          mkdir -p bin/apktool
          wget -q -O bin/apktool/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          chmod +x bin/apktool/apktool.jar
          ls -lh bin/apktool/apktool.jar

          # Bersihkan cache framework lama jika ada
          rm -rf ~/.local/share/apktool/framework/ || true

      - name: Setup Android Signing Keys
        run: |
          echo "==> Setting up signing keys..."
          mkdir -p key bin/key
          wget -q -O key/testkey.x509.pem https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem || true
          wget -q -O key/testkey.pk8 https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 || true
          cp -r key/* bin/key/ 2>/dev/null || true
          ls -lh key/

      - name: Run Port Script
        run: |
          chmod +x port.sh
          ./port.sh c14Op9p_qcom.zip c17Op15_qcom.zip

      - name: Remove Source ROMs
        if: always()
        run: |
          rm -f c14Op9p_qcom.zip
          rm -f c17Op15_qcom.zip

      - name: Output Debug
        if: always()
        run: |
          echo "==> Storage"
          df -h /

          echo "==> Output files"
          find output -type f 2>/dev/null || true
          find out -type f 2>/dev/null || true

      - name: Upload Output Zip
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17_OnePlus9Pro_Port
          path: |
            output/**/*.zip
            out/**/*.zip
          if-no-files-found: error
