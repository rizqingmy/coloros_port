name: Build ColorOS

on:
  workflow_dispatch:
  push:
    branches: [ main, COS16/OOS16 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "==> Membersihkan ruang cakera pelayan GitHub..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1
          df -h

      - name: Install Dependencies
        run: |
          echo "==> Memasang alat sokongan Linux, aria2 & uv..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full unace zip unzip lzop git
          pip3 install --upgrade uv --break-system-packages || pip install --upgrade uv

      - name: Download ROMs
        run: |
          echo "=========================================="
          echo "==> [1/2] Menyedut Base ROM (ColorOS 14) dari Pixeldrain..."
          echo "=========================================="
          aria2c -x 8 -s 8 -k 1M --timeout=30 --max-tries=5 \
            -o c14Op9p_qcom.zip "https://pixeldrain.com/api/file/6tWiZsAy"

          echo "=========================================="
          echo "==> [2/2] Menyedut Donor ROM (ColorOS 17 - 10.2GB) dari GoFile..."
          echo "=========================================="
          git clone https://github.com/ltsdw/gofile-downloader.git
          uv run gofile-downloader/gofile-downloader.py "https://gofile.io/d/PXMZheo2"

          echo "==> Mengesan dan memindahkan fail ColorOS 17..."
          find . -maxdepth 3 -type f -name "*c17*.zip" ! -name "c17Op15_qcom.zip" -exec mv -v {} ./c17Op15_qcom.zip \;
          rm -rf gofile-downloader downloads

          echo "=========================================="
          echo "==> Semakan Integriti Arkib ROM Sedia Ada:"
          echo "=========================================="
          ls -lh *.zip

      - name: Run Porting Process
        run: |
          echo "==> Memulakan skrip porting ROM..."
          if [ -f "./port.sh" ]; then
            chmod +x ./port.sh
            ./port.sh
          elif [ -f "./make.sh" ]; then
            chmod +x ./make.sh
            ./make.sh
          else
            echo "[!] Skrip port.sh / make.sh tidak dijumpai, menjalankan skrip Python utama..."
            python3 main.py || python3 port.py || true
          fi

      - name: Upload Output Zip
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17_OnePlus9Pro_Port
          path: |
            output/*.zip
            out/*.zip
            *.zip
          if-no-files-found: warn
