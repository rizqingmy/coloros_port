name: Build ColorOS Port

on:
  workflow_dispatch:
  push:
    branches: [ main, COS16/OOS16 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full unace zip unzip lzop git xmlstarlet python3 openjdk-11-jre-headless jq
          pip3 install --upgrade uv --break-system-packages || pip install --upgrade uv

      - name: Download ROMs
        run: |
          TOKEN="y3jCpIatp2dgChcB8Iwx9aLyhx9C9s1i"

          echo "==> Downloading Base ROM (ColorOS 14 OnePlus 9 Pro)..."
          aria2c -x 16 -s 16 -k 1M --timeout=30 --max-tries=5 \
            --header="Cookie: accountToken=${TOKEN}" \
            -o c14Op9p_qcom.zip \
            "https://store-na-phx-3.gofile.io/download/web/7dc85f78-92bb-4ca5-83b2-86555ba3ba00/c14Op9p_qcom.zip"

          echo "==> Downloading Donor ROM (ColorOS 17 OnePlus 15)..."
          aria2c -x 16 -s 16 -k 1M --timeout=30 --max-tries=5 \
            --header="Cookie: accountToken=${TOKEN}" \
            -o c17Op15_qcom.zip \
            "https://store-na-phx-5.gofile.io/download/web/513e0a71-79ea-4b95-8dcd-225c07c02693/c17Op15_qcom.zip"

          echo "==> Verifying ROM files..."
          ls -lh c14Op9p_qcom.zip c17Op15_qcom.zip
          sha256sum c14Op9p_qcom.zip c17Op15_qcom.zip

          # Fail early if downloads are incomplete
          test $(stat -c%s c14Op9p_qcom.zip) -gt 1000000000 || (echo "Base ROM too small!" && exit 1)
          test $(stat -c%s c17Op15_qcom.zip) -gt 1000000000 || (echo "Donor ROM too small!" && exit 1)

      - name: Debug Partition Config
        run: |
          echo "==> Partitions to port:"
          grep "partition_to_port" bin/port_config
          echo "==> Possible super partitions:"
          grep "possible_super_list" bin/port_config

      - name: Clean Build Cache
        run: rm -rf build/* output/* out/*

      - name: Run Porting Process
        run: |
          if [ -f "./setup.sh" ]; then
            chmod +x ./setup.sh
            ./setup.sh
          fi
          chmod +x ./port.sh
          ./port.sh c14Op9p_qcom.zip c17Op15_qcom.zip
          rm -f c14Op9p_qcom.zip c17Op15_qcom.zip

      - name: Upload Output Zip
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17_OnePlus9Pro_Port
          path: |
            output/*.zip
            out/*.zip
          if-no-files-found: error
