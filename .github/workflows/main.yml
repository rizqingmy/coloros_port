name: Build ColorOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "==> Membersihkan ruang cakera pelayan GitHub..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1
          df -h

      - name: Install Dependencies
        run: |
          echo "==> Memasang alat sokongan Linux & Python..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget curl p7zip-full unace zip unzip lzop
          pip3 install --upgrade gdown --break-system-packages || pip install --upgrade gdown

      - name: Download ROMs
        run: |
          echo "=========================================="
          echo "==> [1/3] Memuat turun Base ROM (ColorOS 14)..."
          echo "=========================================="
          gdown 1hS1lH0L-e-lVsVN41ZAuWh69_D8kTz9q -O c14Op9p_qcom.zip

          echo "=========================================="
          echo "==> [2/3] Memuat turun Donor ROM (ColorOS 17) dari Pixeldrain..."
          echo "=========================================="
          wget -q --show-progress -O c17_part_aa https://pixeldrain.com/api/file/Wm2gP1aR
          wget -q --show-progress -O c17_part_ab https://pixeldrain.com/api/file/6GCqRYnw

          echo "=========================================="
          echo "==> [3/3] Menyambung semula arkib ColorOS 17..."
          echo "=========================================="
          cat c17_part_aa c17_part_ab > c17Op15_qcom.zip
          rm -f c17_part_*

          echo "==> Integriti fail zip sedia ada:"
          ls -lh *.zip

      - name: Run Porting Process
        run: |
          echo "==> Memulakan skrip porting ROM..."
          if [ -f "./port.sh" ]; then
            chmod +x ./port.sh
            ./port.sh
          elif [ -f "./make.sh" ]; then
            chmod +x ./make.sh
            ./make.sh
          else
            echo "[!] Skrip port.sh / make.sh tidak dijumpai, menjalankan skrip Python utama..."
            python3 main.py || python3 port.py || true
          fi

      - name: Upload Output Zip
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17_OnePlus9Pro_Port
          path: |
            output/*.zip
            out/*.zip
            *.zip
          if-no-files-found: warn
