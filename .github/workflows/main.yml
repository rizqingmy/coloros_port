name: Build ColorOS Port

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space (Kosongkan 45GB Ruang)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          df -h /

      - name: Setup Linux Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip p7zip-full aria2 liblzma-dev brotli zstd curl xmlstarlet wget
          pip3 install --upgrade gdown

      - name: Download ROMs with gdown
        run: |
          echo "==> Memuat turun Base ROM (OnePlus 9 Pro - ColorOS 14)..."
          gdown 1hS1lH0L-e-lVsVN41ZAuWh69_D8kTz9q -O c14Op9p_qcom.zip
          echo "==> Memuat turun Donor ROM (ColorOS 17)..."
          gdown 1XBbSicjhjKpz5h9aN0qHLsKgzQrVX5LO -O c17Op15_qcom.zip
          ls -lh *.zip

      - name: Run Porting Process
        run: |
          chmod -R +x .
          if [ -f setup.sh ]; then
            sudo bash setup.sh
          fi

          # Kemas kini Apktool ke v2.10.0 untuk sokong format ARSC ColorOS 17
          echo "==> Mengemas kini Apktool..."
          wget -q -O /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          find . -name "apktool*.jar" -exec cp -fv /tmp/apktool.jar {} \;
          sudo cp -fv /tmp/apktool.jar /usr/local/bin/apktool.jar 2>/dev/null || true
          sudo cp -fv /tmp/apktool.jar /usr/bin/apktool.jar 2>/dev/null || true

          sudo bash port.sh c14Op9p_qcom.zip c17Op15_qcom.zip

      - name: Upload Output Zip
        if: always()
        run: |
          OUTPUT_ZIP=$(find . -maxdepth 2 -name "*output*.zip" -o -name "*port*.zip" | grep -v "c14" | grep -v "c17" | head -n 1)
          if [ -n "$OUTPUT_ZIP" ]; then
            echo "Memuat naik $OUTPUT_ZIP..."
            curl -F "file=@$OUTPUT_ZIP" https://store1.gofile.io/uploadFile
          else
            echo "Tiada fail output baharu ditemui."
          fi
