name: Build ColorOS Port

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - COS16/OOS16

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space & Check Storage
        run: |
          echo "==> Initial storage"
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium

          sudo docker image prune -af || true

          echo "==> Storage after cleanup"
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            aria2 \
            p7zip-full \
            unace \
            zip \
            unzip \
            lzop \
            git \
            xmlstarlet \
            python3 \
            python3-pip \
            openjdk-11-jre-headless

          pip3 install --upgrade uv --break-system-packages || true

      - name: Download ROMs
        run: |
          echo "==> Downloading Base ROM"
          aria2c \
            -x16 -s16 -k1M \
            --summary-interval=5 \
            --retry-wait=5 \
            --max-tries=20 \
            --continue=true \
            -o c14Op9p_qcom.zip \
            "https://huggingface.co/rizqingsenpai/coloros\_port\_roms/resolve/main/c14Op9p\_qcom.zip"

          echo "==> Downloading Donor ROM"
          aria2c \
            -x16 -s16 -k1M \
            --summary-interval=5 \
            --retry-wait=5 \
            --max-tries=20 \
            --continue=true \
            -o c17Op15_qcom.zip \
            "https://huggingface.co/rizqingsenpai/coloros\_port\_roms/resolve/main/c17Op15\_qcom.zip"

          echo "==> Verify downloaded files"
          ls -lh c14Op9p_qcom.zip c17Op15_qcom.zip

          test $(stat -c%s c14Op9p_qcom.zip) -gt 1000000000 || (echo "Base ROM too small!" && exit 1)
          test $(stat -c%s c17Op15_qcom.zip) -gt 1000000000 || (echo "Donor ROM too small!" && exit 1)

          echo "==> Storage after downloads"
          df -h /

      - name: Show Port Config
        run: |
          echo "==> Partitions"
          grep partition_to_port bin/port_config || true

          echo "==> Super list"
          grep possible_super_list bin/port_config || true

      - name: Clean Build Cache
        run: |
          rm -rf build
          rm -rf output
          rm -rf out

          mkdir -p build
          mkdir -p output
          mkdir -p out

      - name: Storage Before Porting
        run: |
          df -h /

      - name: Run Setup
        run: |
          if [ -f setup.sh ]; then
            chmod +x setup.sh
            ./setup.sh
          fi

      - name: Run Port Script
        run: |
          chmod +x port.sh
          ./port.sh c14Op9p_qcom.zip c17Op15_qcom.zip

      - name: Remove Source ROMs
        if: always()
        run: |
          rm -f c14Op9p_qcom.zip
          rm -f c17Op15_qcom.zip

      - name: Storage After Porting
        if: always()
        run: |
          df -h /

      - name: Show Output Files
        if: always()
        run: |
          echo "==> Output directory"
          find output -type f 2>/dev/null || true

          echo "==> Out directory"
          find out -type f 2>/dev/null || true

      - name: Upload Output Zip
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17_OnePlus9Pro_Port
          path: |
            output/**/*.zip
            out/**/*.zip
          if-no-files-found: error
